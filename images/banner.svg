<svg xmlns="http://www.w3.org/2000/svg" width="728" height="200" viewBox="0 0 728 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="star-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#c8960c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="728" height="200" fill="url(#bg)" rx="12"/>

  <!-- Subtle film-strip left decoration -->
  <rect x="0" y="0" width="56" height="200" fill="#000" opacity="0.35" rx="12"/>
  <rect x="0" y="0" width="56" height="200" fill="none" stroke="#222" stroke-width="1" rx="12"/>
  <rect x="8" y="16" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="8" y="52" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="8" y="88" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="8" y="124" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="8" y="160" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>

  <!-- Subtle film-strip right decoration -->
  <rect x="672" y="0" width="56" height="200" fill="#000" opacity="0.35" rx="12"/>
  <rect x="672" y="0" width="56" height="200" fill="none" stroke="#222" stroke-width="1" rx="12"/>
  <rect x="680" y="16" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="680" y="52" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="680" y="88" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="680" y="124" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="680" y="160" width="40" height="28" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>

  <!-- Star icon (geometric, original) -->
  <polygon
    points="364,42 373,68 401,68 378,84 387,110 364,94 341,110 350,84 327,68 355,68"
    fill="url(#star-fill)" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="364" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">Jellyfin IMDb Plugin</text>

  <!-- Subtitle -->
  <text x="364" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400"
        fill="#f5c518" text-anchor="middle" letter-spacing="2" opacity="0.9">RATINGS · POSTERS · TOP 250</text>
</svg>
